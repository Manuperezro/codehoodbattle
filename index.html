    <title>Python Code Arena | Fix the Code. Beat the Bugs. Become a Python Champion!</title>
    <script id="root-file-redirect">
      // If opened directly from disk (file://) at the project root, redirect to the compiled dist/index.html
      if (
        window.location.protocol === 'file:' &&
        !window.location.pathname.replace(/\\/g, '/').includes('/dist/')
      ) {
        window.location.replace('./dist/index.html');
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
